volumes:
  pg_data:

services:
  django:
    build: 
      context: ../../.
      dockerfile: compose\local\django\DockerFile
      secrets:
        - global-env
    container_name: bma_django
    restart: unless-stopped
    env_file:
      - ./.envs/django.env
    depends_on:
      postgres:
        condition: service_healthy
      # valkey:
      #   condition: service_healthy
    volumes:
      - .:/app
      # - compose\local\django\start:/start # Copy Entrpoint script and add compose/ in .dockerignore
    ports:
      - "8000:8000"
    # healthcheck:
    #   test: ["CMD-SHELL", "curl <health-check-endpoint>"]
    #   interval: 20s
    #   timeout: 30s
    #   retries: 5
    #   start_period: 30s
  
  postgres:
    build: 
      context: ../../.
      dockerfile: compose\local\pg\Dockerfile 
      secrets:
        - global-env
    container_name: bma_postgres
    env_file:
      - ./.envs/postgres.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 5


secrets:
  global-env:
    file: ../../.env
  