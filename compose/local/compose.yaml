volumes:
  pg_data:

services:
  django:
    build:
      context: ../../.
      dockerfile: compose/local/django/DockerFile
      secrets:
        - global-env
    container_name: bma_django
    restart: unless-stopped
    env_file:
      - ../../.envs/django.env
      - ../../.envs/postgres.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../.:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=True
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"

  postgres:
    build:
      context: ../../.
      dockerfile: compose/local/pg/Dockerfile
      secrets:
        - global-env
    container_name: bma_postgres
    env_file:
      - ../../.envs/postgres.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 5

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../compose/local/vue/Dockerfile
    container_name: bma_frontend
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ../../.envs/vite.env


secrets:
  global-env:
    file: ../../.env
