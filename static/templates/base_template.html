<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% block title %} {{ page_title|default:"Public Site" }} {% endblock %}
    </title>

    {% if favicon_url %}
    <link rel="icon" type="image/x-icon" href="{{ favicon_url }}" />
    {% endif %}

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    {% block extra_head %} {% endblock %}
  </head>

  <body>
    {% block body %} {% endblock %}

    <!-- Global API Error Snackbar -->
    <div
      id="api-error-snack"
      class="toast align-items-center text-bg-danger border-0 position-fixed bottom-0 end-0 m-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      style="z-index: 9999"
    >
      <div class="d-flex">
        <div class="toast-body" id="api-error-message">
          Something went wrong.
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>
    </div>

    <script>
      function getCSRFToken() {
        return document.querySelector("[name=csrfmiddlewaretoken]").value;
      }
      /**
       * Global API call helper
       * - Supports GET / POST / PUT / PATCH / DELETE
       * - Automatically handles JSON
       * - Shows Bootstrap toast on failure
       */
      async function makeApiCall(url, method = "GET", data = null) {
        try {
          const options = {
            method: method,
            headers: {
              "Content-Type": "application/json",
              "X-Csrftoken": getCSRFToken(),
            },
          };

          if (data && method !== "GET") {
            options.body = JSON.stringify(data);
          }

          const response = await fetch(url, options);

          let responseData = {};
          try {
            responseData = await response.json();
          } catch {
            try {
              responseData = await response.text();
            } catch {
              responseData = {};
            }
          }

          /* Let the base component decide
           *  what do on the given error code
           */
          // if (!response.ok) {
          //   throw new Error(
          //     responseData.message ||
          //       responseData.detail ||
          //       responseData.errors ||
          //       `Request failed with status ${response.status}`,
          //   );
          // }

          return {
            status: response.status,
            response: responseData,
          };
        } catch (error) {
          showApiError(error.message || "Unexpected API error");
          return {
            status: 500,
            response: null,
            error: error.message,
          };
        }
      }

      /**
       * Show global error toast
       */
      function showApiError(message) {
        const errorMessage = document.getElementById("api-error-message");
        errorMessage.textContent = message;

        const toastElement = document.getElementById("api-error-snack");
        const toast = new bootstrap.Toast(toastElement);
        toast.show();
      }
    </script>

    {% block script %} {% endblock %}

    <!-- Bootstrap JS required for Toast -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
