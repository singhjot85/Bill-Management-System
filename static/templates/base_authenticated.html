{% extends "base_template.html" %}

{% block body %}
<div class="container-fluid">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light px-4 py-3 shadow-sm">
        <span class="navbar-brand mb-0 h4">
            {{ data.org.name|default:"Application" }}
        </span>

        <button
            class="btn btn-outline-danger"
            onclick="logoutUser()"
        >
            Logout
        </button>
    </nav>

    <!-- Protected Content -->
    <main class="container mt-5">
        {% block authenticated_body %}
        {% endblock %}
    </main>

</div>
{% endblock %}
