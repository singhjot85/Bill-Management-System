{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% block title %}
                {{ page_title|default:"Application" }}
            {% endblock title %}
        </title>
        {% if favicon_url %}<link rel="icon" type="image/x-icon" href="{{ favicon_url }}" />{% endif %}
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet"
              crossorigin="anonymous" />
        <!-- App CSS Variables -->
        <link rel="stylesheet" href="{% static 'css/variables.css' %}" />
        <!-- Base Global Styles -->
        <link rel="stylesheet" href="{% static 'css/base.css' %}" />
        {% block extra_head %}
        {% endblock extra_head %}
    </head>
    <body class="app-body">
        {% block body %}
        {% endblock body %}
        {% include "components/snackbar.html" %}
        <!-- The js logic is going to grow use exporting from file -->
        <script src="{% static 'js/base.js' %}"></script>
        {% block script %}
        {% endblock script %}
    </body>
</html>
